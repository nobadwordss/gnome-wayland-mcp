[package]
name = "gnome-wayland-mcp"
version = "0.2.4"
edition = "2024"
rust-version = "1.91"
description = "Local MCP for a private headless GNOME Wayland desktop"
license = "MIT"
repository = "https://github.com/nobadwordss/gnome-wayland-mcp"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
rmcp = { version = "3.11", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rustix = { version = "1.1", features = ["process"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.24"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.20", features = ["v4"] }
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"
