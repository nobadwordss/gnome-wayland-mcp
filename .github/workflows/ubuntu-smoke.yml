name: Ubuntu smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install desktop and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-bin dbus-daemon gir1.2-gtk-4.0 gstreamer1.0-pipewire gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-tools libgl1-mesa-dri mutter \
            pipewire pipewire-bin python3-gi python3-pil wireplumber
          dpkg-query -W mutter pipewire wireplumber gstreamer1.0-tools

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build the server
        run: cargo build --locked

      - name: Run GTK smoke test
        run: /usr/bin/python3 -B tests/headless_smoke.py target/debug/gnome-wayland-mcp

      - name: Check click delivery across a capture disconnect
        run: /usr/bin/python3 -B tests/click_disconnect.py target/debug/gnome-wayland-mcp

      - name: Check double-click and drag selection and interrupted gestures
        run: /usr/bin/python3 -B tests/pointer_gestures.py target/debug/gnome-wayland-mcp
